<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empleo y Contratación en Empresas Socias ACTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003057;
    --navy-2:#012444;
    --blue:#1B5EA6;
    --blue-bright:#2a7bd1;
    --blue-soft:#eaf2fb;
    --gold:#C9A227;
    --bg:#eef3f9;
    --ink:#0e1d2e;
    --muted:#5e6e7f;
    --line:#d6e0ec;
    --white:#ffffff;
    --err:#c0392b;
    --ok:#1f8a52;
    --radius:16px;
    --shadow:0 18px 48px -22px rgba(0,48,87,.55);
    --shadow-sm:0 4px 14px -8px rgba(0,48,87,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Hanken Grotesk',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(27,94,166,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(0,48,87,.10), transparent 55%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 64px}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.12;letter-spacing:-.01em}

  /* ---------- Progress ---------- */
  .topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
    background:linear-gradient(var(--bg),rgba(238,243,249,.7));
    padding:14px 20px 12px;border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .brand{font-family:'Bricolage Grotesque';font-weight:800;color:var(--navy);
    letter-spacing:.14em;font-size:18px;flex:none}
  .brand .dot{color:var(--gold)}
  .brand-logo{height:24px;width:auto;flex:none;display:block}
  .ptrack{flex:1;height:7px;background:#dce6f1;border-radius:99px;overflow:hidden}
  .pfill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--navy),var(--blue) 70%,var(--blue-bright));
    transition:width .45s cubic-bezier(.4,0,.2,1)}
  .pstep{flex:none;font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- Cards ---------- */
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:34px 32px;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
  .noanim .card,.noanim .hero{animation:none}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--gold);display:inline-block}
  h2.title{font-size:28px;font-weight:700;color:var(--navy);margin:12px 0 8px}
  h3.q{font-size:19px;font-weight:700;color:var(--navy);margin:30px 0 4px}
  .sub{color:var(--muted);font-size:15.5px;max-width:58ch}

  /* ---------- Fields ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:24px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field.full{grid-column:1/-1}
  label{font-size:13.5px;font-weight:600;color:#27384a}
  label .req{color:var(--blue);font-weight:700}
  label .opt{color:var(--muted);font-weight:500}
  input[type=text],input[type=email],input[type=tel],input[type=number],textarea{
    font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:11px;background:#fbfdff;color:var(--ink);transition:.18s;width:100%}
  textarea{min-height:130px;resize:vertical;line-height:1.55}
  input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input::placeholder,textarea::placeholder{color:#9fb0c2}
  input:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff;
    box-shadow:0 0 0 4px rgba(27,94,166,.13)}
  input.error,textarea.error{border-color:var(--err);background:#fdf3f2}
  .hint{font-size:12.5px;color:var(--muted)}
  .banner-err{display:none;margin-top:18px;background:#fdeeec;border:1px solid #f3c9c4;
    color:var(--err);padding:11px 14px;border-radius:11px;font-size:13.5px;font-weight:600}
  .banner-err.show{display:block;animation:rise .25s}
  .note{margin-top:22px;background:var(--blue-soft);border:1px solid #cfe0f3;border-radius:12px;
    padding:13px 15px;font-size:13.5px;color:#27384a}
  .note b{color:var(--navy)}

  /* ---------- Dotación ---------- */
  .total-box{margin-top:24px;border:1.5px solid #bcd3ec;border-radius:14px;padding:20px;
    background:linear-gradient(180deg,var(--blue-soft),#fff 75%)}
  .total-box input{max-width:220px;font-size:20px;font-weight:700;color:var(--navy)}
  .sub-rows{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
  .sub-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:13px 16px;border-bottom:1px solid var(--line);background:#fff}
  .sub-row:last-child{border-bottom:none}
  .sub-row .lbl{font-size:14.5px;font-weight:600;color:#27384a}
  .sub-row input{width:110px;flex:none;text-align:right}
  .sub-row input:disabled{background:#f1f4f8;cursor:not-allowed}
  .sub-in{display:flex;align-items:center;gap:8px;flex:none}
  .sub-in .of{font-size:13px;color:var(--muted);font-weight:600;min-width:52px;font-variant-numeric:tabular-nums}
  .row-err{display:none;font-size:12.5px;color:var(--err);font-weight:600;margin-top:3px}
  .row-err.show{display:block}
  .sub-row.bad .lbl{color:var(--err)}

  /* ---------- Opciones ---------- */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .opts.one{grid-template-columns:1fr}
  .opt-tile{position:relative;border:1.5px solid var(--line);border-radius:13px;
    padding:13px 14px 13px 46px;cursor:pointer;background:#fbfdff;transition:.16s;
    font-weight:600;font-size:14.5px;user-select:none}
  .opt-tile:hover{border-color:var(--blue);background:#fff;transform:translateY(-1px)}
  .opt-tile:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(27,94,166,.18)}
  .opt-tile .box{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border:2px solid #b9c8d8;border-radius:6px;transition:.16s}
  .opt-tile.radio .box{border-radius:99px}
  .opt-tile[aria-checked=true]{border-color:var(--blue);background:var(--blue-soft);color:var(--navy)}
  .opt-tile[aria-checked=true] .box{background:var(--blue);border-color:var(--blue)}
  .opt-tile[aria-checked=true] .box::after{content:"";position:absolute;left:6px;top:2px;
    width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  .opt-tile.radio[aria-checked=true] .box::after{left:4px;top:4px;width:8px;height:8px;border:none;
    border-radius:99px;background:#fff;transform:none}
  .opt-tile .desc{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
  .big .opt-tile{padding:18px 16px 18px 50px;font-size:16px}
  .otra-in{margin-top:10px}

  /* ---------- Summary / checkbox ---------- */
  .sumbox{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:4px 18px}
  .sumrow{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .sumrow:last-child{border-bottom:none}
  .sumrow .k{color:var(--muted);font-weight:600;flex:none;max-width:42%}
  .sumrow .v{color:var(--navy);font-weight:600;text-align:right;word-break:break-word}
  .confirm{display:flex;gap:12px;align-items:flex-start;margin-top:24px;background:#fbfdff;
    border:1.5px solid var(--line);border-radius:13px;padding:16px}
  .confirm input{margin-top:3px;width:19px;height:19px;accent-color:var(--blue);flex:none}
  .confirm label{font-size:14px;font-weight:500;color:#27384a;cursor:pointer}

  /* ---------- Nav ---------- */
  .nav{display:flex;gap:12px;margin-top:30px}
  .btn{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:14px 26px;
    cursor:pointer;border:none;transition:.18s;letter-spacing:.01em}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn-primary{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;
    box-shadow:var(--shadow-sm);flex:1}
  .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(27,94,166,.6)}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--navy)}

  /* ---------- Portada ---------- */
  .hero{border-radius:24px;overflow:hidden;position:relative;color:#fff;
    background:linear-gradient(150deg,var(--navy-2),var(--navy) 45%,var(--blue));
    box-shadow:var(--shadow);padding:0;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
  .hero::before{content:"";position:absolute;inset:0;opacity:.5;
    background:
      radial-gradient(420px 320px at 88% 8%, rgba(42,123,209,.55), transparent 60%),
      radial-gradient(360px 300px at 8% 96%, rgba(201,162,39,.22), transparent 60%)}
  .hero-grid{position:absolute;inset:0;opacity:.13;
    background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:46px 46px;mask-image:radial-gradient(120% 100% at 80% 0%,#000,transparent 75%);
    -webkit-mask-image:radial-gradient(120% 100% at 80% 0%,#000,transparent 75%)}
  .hero-in{position:relative;padding:54px 46px 50px}
  .hero-tab{display:block;height:60px;width:auto;margin-left:-46px}
  .hero h1{font-size:clamp(32px,5.6vw,48px);font-weight:800;margin:26px 0 6px;letter-spacing:-.02em}
  .hero .year{color:#9ecbff}
  .hero .org{font-size:15px;opacity:.82;font-weight:500;letter-spacing:.02em}
  .hero p.lead{margin-top:22px;max-width:56ch;font-size:16px;line-height:1.65;opacity:.92}
  .hero .meta{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;letter-spacing:.02em}
  .chip.gold{background:rgba(201,162,39,.22);border-color:rgba(201,162,39,.55)}
  .hero .btn{margin-top:32px;background:#fff;color:var(--navy)}
  .hero .btn:hover{transform:translateY(-2px)}
  .hero .prefill{margin-top:20px;font-size:14px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:11px 14px;display:inline-block}

  .testbadge{flex:none;background:#C9A227;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;
    padding:4px 9px;border-radius:99px}
  .testbanner{background:#C9A227;color:#fff;text-align:center;font-size:12.5px;font-weight:700;
    letter-spacing:.06em;padding:7px 12px;border-radius:10px;margin-bottom:14px}
  @media(max-width:600px){
    .grid,.opts{grid-template-columns:1fr}
    .card{padding:26px 20px}
    .hero-in{padding:40px 24px 38px}
    .hero-tab{margin-left:-24px;height:50px}
    h2.title{font-size:24px}
    .nav{flex-direction:column-reverse}
    .btn-ghost{width:100%}
    .sub-row{flex-direction:column;align-items:stretch;gap:8px}
    .sub-in input{flex:1;width:auto;text-align:left}
    .sumrow{flex-direction:column;gap:2px}
    .sumrow .k{max-width:none}
    .sumrow .v{text-align:left}
  }
</style>
</head>

<script>
/* =====================================================================
   CONFIGURACIÓN — lo único que hay que editar
   ===================================================================== */
// URL /exec de la implementación del Apps Script (Implementar → Nueva implementación → Aplicación web)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVlCctox4EOCd6uMs-3tfzICdPcQZRvGKCVE_tLgUZTvaKEsFq8waj5pTWUf2y7fx_Og/exec';
// Fecha límite que se muestra en la portada (texto libre). Dejar '' para no mostrarla.
const FECHA_LIMITE = '';
// MODO PRUEBA: true = sin campos obligatorios ni validaciones (para revisar el flujo).
// Cambiar a false antes de enviar el formulario a los socios.
const MODO_PRUEBA = false;

/* =====================================================================
   Opciones (si se cambian aquí, cambiarlas también en el Apps Script)
   ===================================================================== */
const CONTRATA = [
  {v:'Sí', d:'Tenemos previsto contratar en los próximos 6 meses'},
  {v:'No', d:'No contemplamos nuevas contrataciones en los próximos 6 meses'},
  {v:'Aún no lo hemos definido', d:'La decisión todavía depende de otros factores'}
];
const AREAS = [
  'Desarrollo de software / programación',
  'Inteligencia Artificial / Machine Learning',
  'Datos / Data Science / Analítica',
  'Ciberseguridad',
  'Infraestructura / Cloud',
  'Soporte TI',
  'Ventas / Comercial',
  'Marketing / Comunicaciones',
  'Administración / Finanzas',
  'Recursos Humanos / Personas',
  'Operaciones / Gestión de proyectos'
];
const CUANTAS = ['1–2','3–5','6–10','Más de 10','Aún no lo hemos definido'];
const RAZONES = [
  'No tenemos nuevos proyectos o contratos',
  'Situación económica de la empresa',
  'Incertidumbre respecto del mercado',
  'No tenemos presupuesto para nuevas contrataciones',
  'Estamos priorizando mantener la dotación actual',
  'Hemos cubierto las necesidades de personal',
  'Dificultad para encontrar perfiles adecuados',
  'Automatización / incorporación de nuevas tecnologías'
];
const FACTORES = [
  'Evolución de la actividad económica',
  'Nuevos proyectos o contratos',
  'Presupuesto disponible',
  'Demanda de nuestros clientes',
  'Disponibilidad de profesionales especializados',
  'Costos laborales',
  'Incertidumbre regulatoria',
  'Incorporación de nuevas tecnologías / IA'
];
const OTRA = 'Otra';
const DOT_SUB = [
  {k:'mujeres',      l:'Mujeres'},
  {k:'jovenes',      l:'Personas entre 25 y 35 años'},
  {k:'mayores',      l:'Personas mayores de 50 años'},
  {k:'discapacidad', l:'Personas con movilidad reducida y/o algún tipo de discapacidad'}
];
const DRAFT_KEY = 'acti_contratacion_draft';

/* =====================================================================
   Estado
   ===================================================================== */
function emptyState(){
  return {
    step:0, submitted:false, sending:false, error:null,
    contact:{empresa:'',rut:'',nombre:'',cargo:'',correo:'',telefono:''},
    dot:{total:'',mujeres:'',jovenes:'',mayores:'',discapacidad:''},
    contrata:'',
    areas:[], areasOtra:'', cuantas:'',
    razones:[], razonesOtra:'',
    factores:[], factoresOtro:'',
    apoyo:'',
    confirm:false,
    prefilled:false
  };
}
const state = emptyState();

function autoSave(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(state));}catch(e){}}
function autoLoad(){
  try{
    const s=localStorage.getItem(DRAFT_KEY);
    if(s){const d=JSON.parse(s); Object.assign(state,d); state.sending=false; state.error=null;
      if(state.submitted){Object.assign(state,emptyState());}}
  }catch(e){}
}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}

/* Link personalizado: ?empresa=Nombre&rut=76.123.456-7 */
function applyUrlParams(){
  try{
    const q=new URLSearchParams(location.search);
    const emp=(q.get('empresa')||'').trim(), rut=(q.get('rut')||'').trim();
    if(emp){state.contact.empresa=emp; state.prefilled=true;}
    if(rut){state.contact.rut=fmtRut(rut); state.prefilled=true;}
  }catch(e){}
}

/* =====================================================================
   Utilidades
   ===================================================================== */
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim());
const isInt=v=>/^\d+$/.test(String(v).trim());

function cleanRut(v){return String(v||'').toUpperCase().replace(/[^0-9K]/g,'');}
function normRut(v){const c=cleanRut(v); return c.length<2?'':c.slice(0,-1)+'-'+c.slice(-1);}
function fmtRut(v){
  const n=normRut(v); if(!n) return String(v||'').trim();
  const [b,dv]=n.split('-');
  return b.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv;
}
function validRut(v){
  const n=normRut(v); if(!n) return false;
  const [b,dv]=n.split('-'); if(!/^\d{7,8}$/.test(b)) return false;
  let sum=0,mul=2;
  for(let i=b.length-1;i>=0;i--){sum+=(+b[i])*mul; mul=mul===7?2:mul+1;}
  const r=11-(sum%11), exp=r===11?'0':r===10?'K':String(r);
  return exp===dv;
}

function getByPath(p){return p.split('.').reduce((o,k)=>(o==null?undefined:o[k]),state);}
function setByPath(p,v){const ks=p.split('.');let o=state;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}

/* =====================================================================
   Pasos
   ===================================================================== */
const STEPS=['portada','empresa','dotacion','contrata','detalle','apoyo','confirmacion'];
function curKey(){return STEPS[state.step];}

/* =====================================================================
   Componentes
   ===================================================================== */
function field(label,path,{req=false,type='text',ph='',full=false,hint='',opt=false,mode=''}={}){
  const val=esc(getByPath(path)||'');
  return `<div class="field ${full?'full':''}">
    <label for="f-${path}">${label} ${req?'<span class="req">*</span>':''}${opt?'<span class="opt">(opcional)</span>':''}</label>
    <input id="f-${path}" type="${type}" data-bind="${path}" value="${val}" placeholder="${esc(ph)}" autocomplete="off" ${mode?`inputmode="${mode}"`:''}>
    ${hint?`<span class="hint">${hint}</span>`:''}
  </div>`;
}

function tiles(list,path,{multi=true,one=false,big=false,descs=null}={}){
  const cur=getByPath(path);
  const items=list.map((v,i)=>{
    const checked=multi?cur.includes(v):cur===v;
    const d=descs?descs[i]:'';
    return `<div class="opt-tile ${multi?'':'radio'}" role="${multi?'checkbox':'radio'}" tabindex="0"
      aria-checked="${checked}" data-tile="${path}" data-multi="${multi?1:0}" data-val="${esc(v)}">
      <span class="box"></span>${esc(v)}${d?`<span class="desc">${esc(d)}</span>`:''}
    </div>`;
  }).join('');
  return `<div class="opts ${one?'one':''} ${big?'big':''}" ${multi?'':'role="radiogroup"'}>${items}</div>`;
}

function otraInput(listPath,textPath,label){
  if(!getByPath(listPath).includes(OTRA)) return '';
  return `<div class="field otra-in">
    <input type="text" maxlength="150" data-bind="${textPath}" value="${esc(getByPath(textPath))}" placeholder="${esc(label)}" autocomplete="off">
  </div>`;
}

function card(eyebrow,title,sub,inner,primaryLabel){
  return `<div class="card">
    <span class="eyebrow">${eyebrow}</span>
    <h2 class="title">${title}</h2>
    ${sub?`<p class="sub">${sub}</p>`:''}
    ${inner}
    <div class="banner-err" id="berr">Completa los campos obligatorios para continuar.</div>
    ${navHTML(primaryLabel)}
  </div>`;
}
function navHTML(primaryLabel){
  const back=state.step>0?`<button class="btn btn-ghost" data-back ${state.sending?'disabled':''}>← Atrás</button>`:'';
  return `<div class="nav">${back}<button class="btn btn-primary" data-next ${state.sending?'disabled':''}>${primaryLabel||'Continuar →'}</button></div>`;
}

      <p class="lead">Con el objetivo de conocer la situación actual de empleo y las necesidades de contratación de nuestras empresas socias, les invitamos a responder este breve formulario. La información permitirá identificar tendencias, oportunidades de empleo y posibles necesidades de apoyo para fortalecer la contratación y el desarrollo del talento en el sector tecnológico.</p>
      ${pre}
      <div class="meta">
        <span class="chip">3 preguntas</span>
        <span class="chip">Menos de 5 minutos</span>
        <span class="chip">Información confidencial</span>
        ${FECHA_LIMITE?`<span class="chip gold">Responder antes del ${esc(FECHA_LIMITE)}</span>`:''}

}

function viewEmpresa(){
  return card('Paso 1','Datos de la empresa',
    'Una respuesta por empresa socia. Quien responde puede ser cualquier persona con conocimiento de la dotación y los planes de contratación.',
    `<div class="grid">
      ${field('Empresa','contact.empresa',{req:true,ph:'Razón social o nombre de fantasía'})}
      ${field('RUT de la empresa','contact.rut',{req:true,ph:'76.123.456-7'})}
      ${field('Nombre de quien responde','contact.nombre',{req:true,full:true})}
      ${field('Cargo','contact.cargo',{req:true})}
      ${field('Correo electrónico','contact.correo',{req:true,type:'email'})}
      ${field('Teléfono','contact.telefono',{type:'tel',opt:true,ph:'+56 9 ...'})}
    </div>`);
}

function viewDotacion(){
  const rows=DOT_SUB.map(s=>`
    <div class="sub-row" id="row-${s.k}">
      <div><label class="lbl" for="f-dot.${s.k}">${s.l}</label><div class="row-err" id="err-${s.k}"></div></div>
      <div class="sub-in">
        <input id="f-dot.${s.k}" type="number" min="0" step="1" inputmode="numeric" data-bind="dot.${s.k}" data-dot value="${esc(state.dot[s.k])}" placeholder="—">
        <span class="of" id="of-${s.k}"></span>
      </div>
    </div>`).join('');
  return card('Pregunta 1','Dotación actual',
    '¿Cuántas personas trabajan actualmente en su empresa?',
    `<div class="total-box">
      <div class="field">
        <label for="f-dot.total">Total de trabajadores <span class="req">*</span></label>
        <input id="f-dot.total" type="number" min="0" step="1" inputmode="numeric" data-bind="dot.total" data-dot value="${esc(state.dot.total)}" placeholder="0">
        <span class="hint">Considere a todas las personas con contrato de trabajo vigente en la empresa.</span>
      </div>
    </div>
    <h3 class="q">Del total, ¿cuántas personas son…? <span class="opt" style="font-family:'Hanken Grotesk';font-size:14px;font-weight:500;color:var(--muted)">(opcional)</span></h3>
    <p class="hint" style="margin-bottom:6px">Si no cuenta con el dato, deje el campo en blanco. Si no hay personas en esa categoría, ingrese 0.</p>
    <p class="hint" id="dot-hint" style="margin-bottom:6px;color:var(--blue);font-weight:600">Ingrese primero el total de trabajadores para completar estas categorías.</p>
    <div class="sub-rows">${rows}</div>`);
}

function viewContrata(){
  return card('Pregunta 2','Contrataciones en los próximos 6 meses',
    '¿Su empresa tiene previsto realizar nuevas contrataciones durante los próximos 6 meses?',
    tiles(CONTRATA.map(c=>c.v),'contrata',{multi:false,one:true,big:true,descs:CONTRATA.map(c=>c.d)}));
}

function viewDetalle(){
  const c=state.contrata;
  if(c==='Sí'){
    return card('Pregunta 3','Áreas de contratación',
      '¿En qué áreas o perfiles tiene previsto realizar contrataciones durante los próximos 6 meses? Puede marcar más de una.',
      `${tiles(AREAS.concat(OTRA),'areas')}
       ${otraInput('areas','areasOtra','Indique cuál')}
       <h3 class="q">¿Cuántas personas estima contratar? <span style="font-family:'Hanken Grotesk';font-size:14px;font-weight:500;color:var(--muted)">(opcional)</span></h3>
       ${tiles(CUANTAS,'cuantas',{multi:false})}`);
  }
  if(c==='No'){
    return card('Pregunta 3','Razones para no contratar',
      '¿Cuáles son las principales razones por las que su empresa no contempla nuevas contrataciones durante los próximos 6 meses? Puede marcar más de una.',
      `${tiles(RAZONES.concat(OTRA),'razones')}
       ${otraInput('razones','razonesOtra','Indique cuál')}`);
  }
  return card('Pregunta 3','Factores en la decisión',
    '¿Qué factores están incidiendo principalmente en la decisión de contratar o no contratar durante los próximos 6 meses? Puede marcar más de uno.',
    `${tiles(FACTORES.concat(OTRA),'factores')}
     ${otraInput('factores','factoresOtro','Indique cuál')}`);
}

function viewApoyo(){
  const sub=state.contrata==='No'
    ?'¿Existe algún tipo de apoyo que ACTI pudiera impulsar para contribuir a la generación de empleo o contratación en su empresa?'
    :'¿Hay algún apoyo que ACTI pudiera impulsar para facilitar la contratación o el desarrollo de talento en su empresa?';
  return card('Pregunta 4','Apoyo de ACTI',sub,
    `<div class="field" style="margin-top:22px">
      <label for="f-apoyo">Su respuesta <span class="opt">(opcional)</span></label>
      <textarea id="f-apoyo" data-bind="apoyo" maxlength="1000" placeholder="Por ejemplo: vinculación con instituciones de formación, programas de reconversión, información sobre instrumentos públicos de apoyo al empleo…">${esc(state.apoyo)}</textarea>
    </div>`);
}

function listaConOtra(list,otra){
  const l=list.filter(x=>x!==OTRA);
  if(list.includes(OTRA)&&otra.trim()) l.push('Otra: '+otra.trim());
  return l.join(' · ')||'—';
}
function viewConfirmacion(){
  const d=state.dot, sub=k=>d[k]===''?'No informa':d[k];
  let det='';
  if(state.contrata==='Sí'){
    det=`<div class="sumrow"><span class="k">Áreas</span><span class="v">${esc(listaConOtra(state.areas,state.areasOtra))}</span></div>
         <div class="sumrow"><span class="k">Personas a contratar</span><span class="v">${esc(state.cuantas||'No informa')}</span></div>`;
  }else if(state.contrata==='No'){
    det=`<div class="sumrow"><span class="k">Razones</span><span class="v">${esc(listaConOtra(state.razones,state.razonesOtra))}</span></div>`;
  }else{
    det=`<div class="sumrow"><span class="k">Factores</span><span class="v">${esc(listaConOtra(state.factores,state.factoresOtro))}</span></div>`;
  }
  const apoyo=state.apoyo.trim();
  const errBox=state.error?`<div class="banner-err show">No se pudo enviar: ${esc(state.error)}. Sus respuestas siguen guardadas; intente nuevamente en unos segundos.</div>`:'';
  return card('Paso final','Revisión y envío',
    'Revise sus respuestas antes de enviar. Puede volver atrás para corregir cualquier dato.',
    `<div class="sumbox">
      <div class="sumrow"><span class="k">Empresa</span><span class="v">${esc(state.contact.empresa)} · ${esc(fmtRut(state.contact.rut))}</span></div>
      <div class="sumrow"><span class="k">Responde</span><span class="v">${esc(state.contact.nombre)} · ${esc(state.contact.correo)}</span></div>
      <div class="sumrow"><span class="k">Dotación total</span><span class="v">${esc(d.total)}</span></div>
      <div class="sumrow"><span class="k">Mujeres · 25–35 · +50 · Discapacidad</span><span class="v">${esc(sub('mujeres'))} · ${esc(sub('jovenes'))} · ${esc(sub('mayores'))} · ${esc(sub('discapacidad'))}</span></div>
      <div class="sumrow"><span class="k">Contratará en 6 meses</span><span class="v">${esc(state.contrata)}</span></div>
      ${det}
      <div class="sumrow"><span class="k">Apoyo ACTI</span><span class="v">${apoyo?esc(apoyo.length>140?apoyo.slice(0,140)+'…':apoyo):'—'}</span></div>
    </div>
    <div class="confirm">
      <input type="checkbox" id="cfm" data-bind="confirm" ${state.confirm?'checked':''}>
      <label for="cfm">Declaro que la información corresponde a la situación actual de la empresa. ACTI la tratará de forma confidencial y la reportará solo de manera agregada.</label>
    </div>
    ${errBox}`,
    state.sending?'Enviando…':'Enviar respuestas');
}

/* =====================================================================
   Render
   ===================================================================== */
function render(opts){
  const o=Object.assign({scroll:true,anim:true},opts||{});
  const key=curKey(), app=document.getElementById('app');
  let html='';
  if(state.submitted) html=viewExito();
  else if(key==='portada') html=viewPortada();
  else if(key==='empresa') html=viewEmpresa();
  else if(key==='dotacion') html=viewDotacion();
  else if(key==='contrata') html=viewContrata();
  else if(key==='detalle') html=viewDetalle();
  else if(key==='apoyo') html=viewApoyo();
  else html=viewConfirmacion();
  document.getElementById('wrap').classList.toggle('noanim',!o.anim);
  app.innerHTML=html;
  bind(); updateProgress(); if(key==='dotacion'&&!state.submitted) checkDot();
  if(o.scroll) window.scrollTo({top:0,behavior:'smooth'});
}
function softRender(){render({scroll:false,anim:false});}

/* Control en vivo de la dotación: los subgrupos no pueden superar el total */
function checkDot(){
  const tEl=document.querySelector('[data-bind="dot.total"]'); if(!tEl) return true;
  const tv=String(state.dot.total).trim(), T=isInt(tv)?+tv:null;
  let ok=true;
  const setRow=(k,msg)=>{
    const row=document.getElementById('row-'+k), err=document.getElementById('err-'+k),
          inp=document.querySelector(`[data-bind="dot.${k}"]`);
    row.classList.toggle('bad',!!msg); err.textContent=msg||''; err.classList.toggle('show',!!msg);
    inp.classList.toggle('error',!!msg); if(msg) ok=false;
  };
  DOT_SUB.forEach(s=>{
    const inp=document.querySelector(`[data-bind="dot.${s.k}"]`);
    inp.disabled=(T===null);
    inp.placeholder=T===null?'—':'0 a '+T;
    if(T===null) inp.removeAttribute('max'); else inp.max=T;
    document.getElementById('of-'+s.k).textContent=T===null?'':'de '+T;
    const v=String(state.dot[s.k]).trim();
    if(T!==null&&v!==''&&!isInt(v)) setRow(s.k,'Use solo números enteros.');
    else if(T!==null&&v!==''&&+v>T) setRow(s.k,'Supera el total de trabajadores ('+T+').');
    else setRow(s.k,'');
  });
  const j=String(state.dot.jovenes).trim(), m=String(state.dot.mayores).trim();
  if(T!==null&&isInt(j)&&isInt(m)&&+j<=T&&+m<=T&&(+j)+(+m)>T){
    const msg='25–35 años y mayores de 50 suman '+((+j)+(+m))+', más que el total ('+T+').';
    setRow('jovenes',msg); setRow('mayores',msg);
  }
  const hint=document.getElementById('dot-hint');
  if(hint) hint.style.display=T===null?'block':'none';
  return ok;
}

function updateProgress(){
  const tb=document.getElementById('topbar');
  if(curKey()==='portada'||state.submitted){tb.style.display='none';return;}
  tb.style.display='block';
  document.getElementById('testbadge').style.display=MODO_PRUEBA?'inline-block':'none';
  const total=STEPS.length-1;
  document.getElementById('pfill').style.width=Math.round(state.step/total*100)+'%';
  document.getElementById('pstep').textContent=`Paso ${state.step} de ${total}`;
}

/* =====================================================================
   Eventos
   ===================================================================== */
function bind(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    if(el.type==='checkbox'){
      el.addEventListener('change',()=>{setByPath(el.dataset.bind,el.checked);if(el.checked)showErr(null);autoSave();});
    }else{
      el.addEventListener('input',()=>{setByPath(el.dataset.bind,el.value);el.classList.remove('error');autoSave();if(el.hasAttribute('data-dot')){checkDot();showErr(null);}});
      if(el.hasAttribute('data-dot')) el.addEventListener('keydown',e=>{if(['e','E','+','-','.',','].includes(e.key))e.preventDefault();});
    }
    if(state.sending) el.disabled=true;
  });
  const rut=document.querySelector('[data-bind="contact.rut"]');
  if(rut) rut.addEventListener('blur',()=>{state.contact.rut=fmtRut(rut.value);rut.value=state.contact.rut;autoSave();});

  document.querySelectorAll('[data-tile]').forEach(el=>{
    const toggle=()=>{
      const path=el.dataset.tile, v=el.dataset.val, multi=el.dataset.multi==='1';
      if(multi){
        const arr=getByPath(path);
        setByPath(path,arr.includes(v)?arr.filter(x=>x!==v):arr.concat(v));
      }else{
        setByPath(path,getByPath(path)===v&&path==='cuantas'?'':v);
      }
      autoSave(); softRender();
      const again=document.querySelector(`[data-tile="${path}"][data-val="${CSS.escape(v)}"]`);
      if(again) again.focus({preventScroll:true});
      if(multi&&v===OTRA&&getByPath(path).includes(OTRA)){
        const inp=document.querySelector('.otra-in input'); if(inp) inp.focus({preventScroll:true});
      }
    };
    el.addEventListener('click',toggle);
    el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
  });

  const nx=document.querySelector('[data-next]'); if(nx) nx.addEventListener('click',next);
  const rs=document.querySelector('[data-restart]'); if(rs) rs.addEventListener('click',()=>{Object.assign(state,emptyState());state.simulado=false;clearDraft();render();});
  const bk=document.querySelector('[data-back]'); if(bk) bk.addEventListener('click',()=>{state.step--;state.error=null;autoSave();render();});
}

/* =====================================================================
   Validación
   ===================================================================== */
function showErr(msg){
  const b=document.getElementById('berr'); if(!b) return;
  if(msg){b.textContent=msg;b.classList.add('show');}else b.classList.remove('show');
}
function markInvalid(paths){
  paths.forEach(p=>{const el=document.querySelector(`[data-bind="${p}"]`); if(el)el.classList.add('error');});
  const first=document.querySelector(`[data-bind="${paths[0]}"]`);
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
}

function next(){
  const key=curKey(); let bad=[], msg='';
  if(MODO_PRUEBA){
    showErr(null);
    if(key==='empresa'&&state.contact.rut.trim()) state.contact.rut=fmtRut(state.contact.rut);
    if(key==='confirmacion'){enviar();return;}
    state.step++; autoSave(); render(); return;
  }
  if(key==='empresa'){
    const c=state.contact;
    ['empresa','rut','nombre','cargo','correo'].forEach(k=>{if(!(c[k]||'').trim())bad.push('contact.'+k);});
    if(c.rut.trim()&&!validRut(c.rut)){bad.push('contact.rut');msg='El RUT ingresado no es válido. Revise el número y el dígito verificador.';}
    if(c.correo.trim()&&!isEmail(c.correo)){bad.push('contact.correo');msg=msg||'El correo electrónico no tiene un formato válido.';}
  }else if(key==='dotacion'){
    const d=state.dot;
    if(!isInt(d.total)){bad.push('dot.total');msg='Ingrese el total de trabajadores (número entero).';}
    else{
      const T=+d.total;
      DOT_SUB.forEach(s=>{
        const v=String(d[s.k]).trim();
        if(v==='') return;
        if(!isInt(v)){bad.push('dot.'+s.k);msg=msg||'Use solo números enteros.';}
        else if(+v>T){bad.push('dot.'+s.k);msg=msg||'Ninguna categoría puede superar el total de trabajadores.';}
      });
      const j=String(d.jovenes).trim(), m=String(d.mayores).trim();
      if(!bad.length&&isInt(j)&&isInt(m)&&(+j)+(+m)>T){
        bad.push('dot.jovenes','dot.mayores');
        msg='Las personas entre 25 y 35 años y las mayores de 50 no pueden sumar más que el total.';
      }
    }
  }else if(key==='contrata'){
    if(!state.contrata){showErr('Seleccione una opción para continuar.');return;}
  }else if(key==='detalle'){
    const map={'Sí':['areas','areasOtra'],'No':['razones','razonesOtra']}[state.contrata]||['factores','factoresOtro'];
    const [lp,tp]=map, arr=state[lp];
    if(!arr.length){showErr('Seleccione al menos una opción para continuar.');return;}
    if(arr.includes(OTRA)&&!state[tp].trim()){bad.push(tp);msg='Indique cuál es la opción "Otra".';}
  }else if(key==='confirmacion'){
    if(!state.confirm){showErr('Debe marcar la declaración para enviar el formulario.');return;}
    enviar(); return;
  }
  if(bad.length){markInvalid(bad);showErr(msg||'Completa los campos obligatorios para continuar.');return;}
  showErr(null);
  if(key==='empresa') state.contact.rut=fmtRut(state.contact.rut);
  state.step++; autoSave(); render();
}

/* =====================================================================
   Envío (JSONP a Google Apps Script)
   ===================================================================== */
function numOrBlank(v){v=String(v).trim(); return v===''?'':+v;}
function buildPayload(){
  const c=state.contact, r={contrata:state.contrata};
  const sel=(arr)=>arr.filter(x=>x!==OTRA);
  if(state.contrata==='Sí'){
    r.areas=sel(state.areas); r.areasOtra=state.areas.includes(OTRA)?state.areasOtra.trim():''; r.cuantas=state.cuantas;
  }else if(state.contrata==='No'){
    r.razones=sel(state.razones); r.razonesOtra=state.razones.includes(OTRA)?state.razonesOtra.trim():'';
  }else{
    r.factores=sel(state.factores); r.factoresOtro=state.factores.includes(OTRA)?state.factoresOtro.trim():'';
  }
  r.apoyo=state.apoyo.trim();
  return {
    contact:{empresa:c.empresa.trim(),rut:normRut(c.rut)||c.rut.trim(),nombre:c.nombre.trim(),cargo:c.cargo.trim(),
             correo:c.correo.trim().toLowerCase(),telefono:c.telefono.trim()},
    dotacion:{total:numOrBlank(state.dot.total),mujeres:numOrBlank(state.dot.mujeres),jovenes:numOrBlank(state.dot.jovenes),
              mayores:numOrBlank(state.dot.mayores),discapacidad:numOrBlank(state.dot.discapacidad)},
    respuestas:r,
    origen:(MODO_PRUEBA?'PRUEBA · ':'')+(state.prefilled?'Link personalizado':'Link general')
  };
}

function enviar(){
  if(state.sending) return;
  if(!/^https:\/\/script\.google\.com\//.test(APPS_SCRIPT_URL)){
    if(MODO_PRUEBA){clearDraft();state.submitted=true;state.simulado=true;render();return;}
    state.error='el formulario aún no está conectado a la base de datos (falta configurar APPS_SCRIPT_URL)';
    softRender(); return;
  }
  state.sending=true; state.error=null; softRender();
  const payload=buildPayload();
  const cb='acti_cb_'+Date.now();
  const sc=document.createElement('script');
  let done=false;
  const finish=()=>{done=true;clearTimeout(timer);window[cb]=function(){};try{sc.remove();}catch(e){}};
  const fail=msg=>{if(done)return;finish();state.sending=false;state.error=msg;softRender();};
  window[cb]=function(res){
    if(done) return; finish();
    if(res&&res.ok){clearDraft();state.submitted=true;state.sending=false;render();}
    else{state.sending=false;state.error=(res&&res.error)||'respuesta inesperada del servidor';softRender();}
  };
  const timer=setTimeout(()=>fail('el servidor no respondió a tiempo'),30000);
  sc.onerror=()=>fail('no se pudo conectar con el servidor');
  sc.src=APPS_SCRIPT_URL+'?callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload));
  document.body.appendChild(sc);
}

/* =====================================================================
   Inicio
   ===================================================================== */
autoLoad();
applyUrlParams();
render({scroll:false});
</script>
